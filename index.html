<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Jumper - Cảm Biến Gyro</title>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background: #0b0c10; 
            color: #66fcf1; 
            font-family: 'Courier New', Courier, monospace; 
            touch-action: none; 
            cursor: crosshair; 
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        #ui-layer { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            pointer-events: none; 
            z-index: 10;
        }
        .stat { margin-bottom: 5px; font-size: 16px; font-weight: bold; text-shadow: 0 0 5px #66fcf1;}
        #score-display { font-size: 24px; color: #45a29e; }
        
        /* Cụm nút điều khiển góc phải */
        #top-right-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 15;
        }
        .icon-btn {
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            text-shadow: 0 0 10px #66fcf1;
            user-select: none;
            background: rgba(11, 12, 16, 0.6);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #45a29e;
        }
        .icon-btn:hover { transform: scale(1.1); }
        .gyro-active { filter: hue-rotate(90deg) brightness(1.5); border-color: #2ecc71; }

        #settings-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(11, 12, 16, 0.95);
            border: 2px solid #66fcf1;
            border-radius: 12px;
            padding: 25px;
            width: 80%;
            max-width: 320px;
            z-index: 30;
            display: none;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
        }
        #settings-menu h2 { margin: 0 0 20px 0; text-align: center; text-shadow: 0 0 8px #66fcf1; }
        .setting-row { margin-bottom: 20px; }
        .setting-row label { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: #45a29e; }
        
        #game-over { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(11, 12, 16, 0.9); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 20;
            display: none;
        }
        #game-over h1 { font-size: 40px; text-shadow: 0 0 15px #c5c6c7; color: #c5c6c7; margin-bottom: 10px; text-align: center;}
        #game-over p { font-size: 20px; margin-bottom: 30px; }
        
        button { 
            padding: 12px 30px; 
            font-size: 18px; font-weight: bold;
            background: #1f2833; 
            color: #66fcf1; 
            border: 2px solid #66fcf1; 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 0 10px #66fcf1;
            transition: 0.2s;
            width: 100%;
        }
        button:hover { background: rgba(102, 252, 241, 0.2); }
        button:active { background: #66fcf1; color: #0b0c10; }

        /* Thông báo cảm biến */
        #gyro-toast {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: #0b0c10;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="stat" id="score-display">Điểm: <span id="score">0</span></div>
        <div class="stat">Chiều dài: <span id="length">1</span>x</div>
    </div>

    <div id="top-right-controls">
        <div class="icon-btn" id="gyro-btn" title="Bật Cảm Biến Nghiêng">📱</div>
        <div class="icon-btn" id="settings-btn" title="Cài Đặt Vật Lý">⚙️</div>
    </div>

    <div id="gyro-toast">Đã Bật Cảm Biến Nghiêng!</div>

    <div id="settings-menu">
        <h2>TÙY CHỈNH VẬT LÝ</h2>
        <div class="setting-row">
            <label>Trọng lực (Rơi): <span id="grav-val">0.3</span></label>
            <input type="range" id="grav-slider" min="0.05" max="1.0" step="0.05" value="0.3">
        </div>
        <div class="setting-row">
            <label>Sức bật (Nhảy): <span id="jump-val">11</span></label>
            <input type="range" id="jump-slider" min="5" max="25" step="0.5" value="11">
        </div>
        <button id="close-settings-btn">Đóng & Tiếp tục</button>
    </div>

    <div id="game-over">
        <h1>TRẠM KHÔNG GIAN SỤP ĐỔ</h1>
        <p>Thành tích: <span id="final-score">0</span> bậc</p>
        <button id="restart-btn" style="width: auto;">Phục Hồi Lại</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gravity = 0.3;         
        let baseJump = 11;        
        const PLATFORM_W = 95;       
        const PLATFORM_H = 12;
        const MIN_JUMP = 7.5;        

        let player, platforms, score, isGameOver, isPaused, gameLoopId;
        
        // --- TRẠNG THÁI CẢM BIẾN ---
        let useGyro = false;
        let gyroGamma = 0; 

        const settingsMenu = document.getElementById('settings-menu');
        const gravSlider = document.getElementById('grav-slider');
        const jumpSlider = document.getElementById('jump-slider');
        const gravVal = document.getElementById('grav-val');
        const jumpVal = document.getElementById('jump-val');
        const gyroBtn = document.getElementById('gyro-btn');
        const gyroToast = document.getElementById('gyro-toast');

        function initGame() {
            score = 0;
            isGameOver = false;
            isPaused = false;
            document.getElementById('game-over').style.display = 'none';
            settingsMenu.style.display = 'none';

            player = {
                x: canvas.width / 2 - 15,
                y: canvas.height / 2,
                targetX: canvas.width / 2 - 15,
                w: 30, h: 30, vy: 0,
                jumpPower: baseJump, level: 0,
                squash: 1.0, angle: 0, flipAngle: 0, flipDir: 1
            };

            platforms = [];
            platforms.push({ 
                x: canvas.width / 2 - PLATFORM_W / 2, 
                y: canvas.height - 100, 
                w: PLATFORM_W, h: PLATFORM_H, 
                visited: true, dx: 0 
            });

            generatePlatforms(canvas.height);
            updateUI();
            cancelAnimationFrame(gameLoopId);
            loop();
        }

        function getMaxJumpHeight() {
            let maxTheoretical = (player.jumpPower * player.jumpPower) / (2 * gravity);
            return maxTheoretical * 0.75; 
        }

        function generatePlatforms(startY) {
            let lastP = platforms[platforms.length - 1];
            let currentY = lastP ? lastP.y : startY;
            
            while (currentY > -canvas.height) {
                let maxSafeGap = getMaxJumpHeight();
                let minGap = Math.min(40, maxSafeGap * 0.5); 
                
                let gapY = Math.random() * (maxSafeGap - minGap) + minGap;
                currentY -= gapY;
                
                let maxX = canvas.width - PLATFORM_W;
                let newX = Math.random() * maxX;
                
                let isMoving = Math.random() < 0.35 && platforms.length > 2;
                let speed = isMoving ? (Math.random() > 0.5 ? 2.5 : -2.5) : 0;

                platforms.push({ 
                    x: newX, y: currentY, 
                    w: PLATFORM_W, h: PLATFORM_H, 
                    visited: false, dx: speed
                });
            }
        }

        function checkEvolution() {
            let nextLevel = Math.floor(score / 10);
            if (nextLevel > player.level) {
                player.level = nextLevel;
                player.h += 15; 
                player.jumpPower = baseJump - (player.level * 0.35);
                if (player.jumpPower < MIN_JUMP) player.jumpPower = MIN_JUMP; 
            }
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('length').innerText = player.level + 1;
        }

        // --- HỆ THỐNG YÊU CẦU QUYỀN GYROSCOPE ---
        function handleOrientation(event) {
            // Gamma là góc nghiêng trái/phải (từ -90 đến 90)
            let gamma = event.gamma; 
            if (gamma > 45) gamma = 45; // Giới hạn góc nghiêng để dễ kiểm soát
            if (gamma < -45) gamma = -45;
            gyroGamma = gamma;
        }

        gyroBtn.addEventListener('click', () => {
            if (useGyro) {
                // Đang bật -> Tắt
                useGyro = false;
                gyroBtn.classList.remove('gyro-active');
                window.removeEventListener('deviceorientation', handleOrientation);
                // Khôi phục targetX bằng x hiện tại để không bị giật
                player.targetX = player.x; 
            } else {
                // Yêu cầu quyền truy cập (Dành cho iOS/Trình duyệt bảo mật)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                enableGyro();
                            } else {
                                alert('Trình duyệt đã từ chối quyền truy cập cảm biến!');
                            }
                        })
                        .catch(console.error);
                } else {
                    // Trình duyệt không yêu cầu xin quyền (như máy tính hoặc Android cũ)
                    enableGyro();
                }
            }
        });

        function enableGyro() {
            useGyro = true;
            gyroBtn.classList.add('gyro-active');
            window.addEventListener('deviceorientation', handleOrientation);
            
            // Hiển thị thông báo
            gyroToast.style.opacity = '1';
            setTimeout(() => { gyroToast.style.opacity = '0'; }, 2000);
        }

        // MENU XỬ LÝ
        document.getElementById('settings-btn').addEventListener('click', () => {
            isPaused = true;
            settingsMenu.style.display = 'block';
        });

        document.getElementById('close-settings-btn').addEventListener('click', () => {
            settingsMenu.style.display = 'none';
            player.jumpPower = baseJump - (player.level * 0.35);
            if (player.jumpPower < MIN_JUMP) player.jumpPower = MIN_JUMP; 
            generatePlatforms(0); 
            isPaused = false;
            loop(); 
        });

        gravSlider.addEventListener('input', (e) => { gravity = parseFloat(e.target.value); gravVal.innerText = gravity.toFixed(2); });
        jumpSlider.addEventListener('input', (e) => { baseJump = parseFloat(e.target.value); jumpVal.innerText = baseJump.toFixed(1); });

        function loop() {
            if (isGameOver || isPaused) return;

            // --- XỬ LÝ DI CHUYỂN BẰNG CẢM BIẾN ---
            if (useGyro) {
                // Biến đổi góc nghiêng thành tốc độ di chuyển
                // Nghiêng 45 độ = tốc độ tối đa ~ 15px/frame
                let moveAmount = (gyroGamma / 45) * 15; 
                player.targetX = player.x + moveAmount;
            }

            // Mượt mà hóa chuyển động ngang
            player.x += (player.targetX - player.x) * (useGyro ? 0.8 : 0.4);

            // Xuyên tường
            if (player.x > canvas.width) player.x = -player.w;
            if (player.x + player.w < 0) player.x = canvas.width;

            player.vy += gravity;
            player.y += player.vy;

            // Animation khôi phục
            player.squash += (1.0 - player.squash) * 0.15;
            
            if (player.flipAngle > 0) {
                let spinSpeed = 0.25; 
                player.angle += spinSpeed * player.flipDir;
                player.flipAngle -= spinSpeed;
                if (player.flipAngle <= 0) { player.angle = 0; player.flipAngle = 0; }
            }

            for (let i = 0; i < platforms.length; i++) {
                let p = platforms[i];
                
                if (p.dx !== 0) {
                    p.x += p.dx;
                    if (p.x < 0) { p.x = 0; p.dx *= -1; }
                    if (p.x + p.w > canvas.width) { p.x = canvas.width - p.w; p.dx *= -1; }
                }

                if (player.vy > 0) {
                    let playerBottom = player.y + player.h;
                    let prevPlayerBottom = playerBottom - player.vy;
                    
                    if (playerBottom >= p.y && prevPlayerBottom <= p.y + p.h) {
                        if (player.x + player.w > p.x - 5 && player.x < p.x + p.w + 5) {
                            player.vy = -player.jumpPower; 
                            player.squash = 0.4; 
                            player.flipAngle = Math.PI * 2; 
                            player.angle = 0;
                            
                            // Lộn vòng theo hướng đang nghiêng hoặc hướng chuột
                            if (useGyro) {
                                player.flipDir = (gyroGamma > 0) ? 1 : -1;
                            } else {
                                player.flipDir = (player.targetX > player.x) ? 1 : -1;
                            }
                            
                            if (!p.visited) {
                                p.visited = true;
                                score++;
                                checkEvolution();
                                updateUI();
                            }
                        }
                    }
                }
            }

            const cameraThreshold = canvas.height / 2;
            if (player.y < cameraThreshold) {
                let diff = cameraThreshold - player.y;
                player.y = cameraThreshold;
                platforms.forEach(p => p.y += diff);
            }

            platforms = platforms.filter(p => p.y < canvas.height + 100);
            if (platforms[platforms.length - 1].y > 0) generatePlatforms(0);

            if (player.y > canvas.height) { gameOver(); return; }

            draw();
            gameLoopId = requestAnimationFrame(loop);
        }

        function draw() {
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let p of platforms) {
                if (!p.visited) {
                    if (p.dx !== 0) {
                        ctx.fillStyle = '#f72585';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#f72585';
                    } else {
                        ctx.fillStyle = '#45a29e';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#66fcf1';
                    }
                } else {
                    ctx.fillStyle = '#1f2833';
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            ctx.save(); 
            let cx = player.x + player.w / 2;
            let cy = player.y + player.h / 2;
            ctx.translate(cx, cy);
            ctx.rotate(player.angle);
            ctx.scale(2 - player.squash, player.squash);

            ctx.fillStyle = '#66fcf1';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#66fcf1';
            ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);
            
            ctx.fillStyle = '#0b0c10';
            ctx.shadowBlur = 0;
            ctx.fillRect(-player.w / 2 + 6, -player.h / 2 + 6, player.w - 12, 6);

            let handOffset = -player.vy * 1.5; 
            if (handOffset < -18) handOffset = -18;
            if (handOffset > 10) handOffset = 10;

            ctx.fillStyle = '#45a29e';
            ctx.shadowBlur = 10;
            ctx.fillRect(-player.w / 2 - 12, handOffset - 6, 8, 12);
            ctx.fillRect(player.w / 2 + 4, handOffset - 6, 8, 12);

            ctx.restore(); 
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'flex';
        }

        function handleMovement(xClient) {
            // Chỉ nhận điều khiển cảm ứng/chuột nếu chưa bật cảm biến Gyro
            if(!isPaused && !isGameOver && !useGyro) {
                player.targetX = xClient - player.w / 2;
            }
        }

        canvas.addEventListener('touchmove', (e) => {
            if(e.target.tagName !== 'INPUT' && !e.target.classList.contains('icon-btn')) e.preventDefault();
            handleMovement(e.touches[0].clientX);
        }, {passive: false});

        canvas.addEventListener('touchstart', (e) => {
            if(e.target.tagName !== 'INPUT' && !e.target.classList.contains('icon-btn')) e.preventDefault();
            handleMovement(e.touches[0].clientX);
        }, {passive: false});

        canvas.addEventListener('mousemove', (e) => handleMovement(e.clientX));

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        document.getElementById('restart-btn').addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
