<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Jumper - Multiplayer Fix</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0b0c10; color: #66fcf1; font-family: 'Courier New', Courier, monospace; touch-action: none; cursor: crosshair; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .stat { margin-bottom: 5px; font-size: 16px; font-weight: bold; text-shadow: 0 0 5px #66fcf1;}
        #score-display { font-size: 24px; color: #45a29e; }
        .opponent-stat { color: #ff9f1c; text-shadow: 0 0 5px #ff9f1c; }

        #mp-lobby { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 40; }
        #mp-lobby h1 { font-size: 32px; color: #66fcf1; text-shadow: 0 0 15px #66fcf1; margin-bottom: 5px;}
        #mp-lobby p { font-size: 16px; margin-bottom: 30px; color: #c5c6c7; }
        .box { background: #1f2833; padding: 20px; border-radius: 12px; border: 1px solid #45a29e; width: 80%; max-width: 320px; text-align: center; margin-bottom: 15px; }
        .box h3 { margin: 0 0 10px 0; color: #45a29e; }
        #my-id-display { font-size: 28px; font-weight: bold; letter-spacing: 3px; color: #ff9f1c; margin-bottom: 10px; user-select: all;}
        input[type="text"] { width: 90%; padding: 10px; font-size: 18px; text-align: center; background: #0b0c10; color: #66fcf1; border: 1px solid #45a29e; border-radius: 6px; font-family: inherit; margin-bottom: 15px; text-transform: uppercase; font-weight: bold;}
        button { padding: 12px 20px; font-size: 16px; font-weight: bold; background: #1f2833; color: #66fcf1; border: 2px solid #66fcf1; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px #66fcf1; transition: 0.2s; width: 100%; margin-bottom: 10px; }
        button:hover { background: rgba(102, 252, 241, 0.2); }
        button:active { background: #66fcf1; color: #0b0c10; }
        .btn-orange { border-color: #ff9f1c; color: #ff9f1c; box-shadow: 0 0 10px #ff9f1c; }
        .btn-orange:active { background: #ff9f1c; color: #0b0c10; }

        #top-right-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 15; }
        .icon-btn { font-size: 28px; cursor: pointer; transition: transform 0.2s, filter 0.2s; text-shadow: 0 0 10px #66fcf1; user-select: none; background: rgba(11, 12, 16, 0.6); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border: 1px solid #45a29e; }
        .gyro-active { filter: hue-rotate(90deg) brightness(1.5); border-color: #2ecc71; }
        
        #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; text-align: center; }
        #game-over h1 { font-size: 40px; text-shadow: 0 0 15px #c5c6c7; color: #c5c6c7; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div id="mp-lobby">
        <h1>NEON JUMPER</h1>
        <p>Phiên bản WebRTC Multiplayer</p>
        
        <div class="box">
            <h3>Mã Phòng Của Bạn</h3>
            <div id="my-id-display">Đang tạo...</div>
            <button id="copy-btn" style="font-size: 14px; padding: 8px;">📋 Cóp chép mã</button>
        </div>

        <div class="box">
            <h3>Vào Phòng Bạn Bè</h3>
            <input type="text" id="peer-id-input" placeholder="NHẬP MÃ TẠO SẴN" maxlength="6">
            <button id="connect-btn" class="btn-orange">Vào Phòng & Chơi</button>
        </div>

        <button id="solo-btn" style="width: 80%; max-width: 320px; border-color: #c5c6c7; color: #c5c6c7; box-shadow: none;">Chơi 1 Mình</button>
    </div>

    <div id="ui-layer">
        <div class="stat" id="score-display">Điểm của bạn: <span id="score">0</span></div>
        <div class="stat opponent-stat" id="opp-score-container" style="display:none;">Đối thủ: <span id="opp-score">0</span></div>
        <div class="stat" style="margin-top: 10px;">Chiều dài: <span id="length">1</span>x</div>
    </div>

    <div id="top-right-controls">
        <div class="icon-btn" id="gyro-btn" title="Bật Cảm Biến Nghiêng">📱</div>
    </div>

    <div id="game-over">
        <h1 id="go-title">TRẠM KHÔNG GIAN SỤP ĐỔ</h1>
        <p style="font-size: 20px;">Thành tích: <span id="final-score">0</span> bậc</p>
        <button id="restart-btn" style="width: auto;">Phục Hồi Lại</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // TẠO MÃ PHÒNG TRƯỚC KHI KẾT NỐI
        const generateId = () => Math.random().toString(36).substring(2, 8).toUpperCase();
        let myPeerId = generateId();
        
        // Đăng ký đúng mã đó với máy chủ
        const peer = new Peer(myPeerId); 
        let conn = null;
        let opponentData = null; 

        peer.on('open', (id) => {
            document.getElementById('my-id-display').innerText = id;
        });

        // Xử lý lỗi nếu máy chủ bận hoặc mã trùng
        peer.on('error', (err) => {
            console.error(err);
            if(err.type === 'unavailable-id') {
                alert('Mã phòng bị trùng, máy sẽ tự động tải lại...');
                window.location.reload();
            }
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });

        document.getElementById('copy-btn').onclick = () => {
            navigator.clipboard.writeText(myPeerId);
            document.getElementById('copy-btn').innerText = "✅ Đã cóp chép";
        };

        document.getElementById('connect-btn').onclick = () => {
            let targetId = document.getElementById('peer-id-input').value.toUpperCase().trim();
            if(targetId) {
                document.getElementById('connect-btn').innerText = "Đang tìm phòng...";
                
                conn = peer.connect(targetId);
                setupConnection(); // Bật chế độ nghe dữ liệu ngay
                
                conn.on('open', () => {
                    document.getElementById('connect-btn').innerText = "Đã tìm thấy!";
                    conn.send({ type: 'ready' });
                });
            } else {
                alert("Cậu chủ chưa nhập mã phòng!");
            }
        };

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'ready') {
                    let seed = Math.floor(Math.random() * 99999);
                    conn.send({ type: 'start', seed: seed });
                    startGame(seed);
                } 
                else if (data.type === 'start') {
                    startGame(data.seed);
                } 
                else if (data.type === 'update') {
                    opponentData = data.player;
                    document.getElementById('opp-score').innerText = opponentData.score;
                }
                else if (data.type === 'dead') {
                    opponentData.isDead = true;
                }
            });
            
            conn.on('close', () => { alert("Đối thủ đã ngắt kết nối!"); });
            conn.on('error', () => { alert("Lỗi mạng! Không thể kết nối tới phòng này."); document.getElementById('connect-btn').innerText = "Vào Phòng & Chơi"; });
        }

        function LCG(seed) {
            return function() {
                seed = (seed * 1664525 + 1013904223) % 4294967296;
                return seed / 4294967296;
            }
        }

        document.getElementById('solo-btn').onclick = () => { startGame(Math.random()); };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const gravity = 0.3;         
        const baseJump = 11;        
        const PLATFORM_W = 95;       
        const PLATFORM_H = 12;
        const MIN_JUMP = 7.5;        

        let player, platforms, score, isGameOver, gameLoopId;
        let useGyro = false, gyroGamma = 0; 
        
        function startGame(seed) {
            document.getElementById('mp-lobby').style.display = 'none';
            if(conn && conn.open) document.getElementById('opp-score-container').style.display = 'block';
            initGame(seed);
        }

        function initGame(seed) {
            score = 0;
            isGameOver = false;
            opponentData = null;
            document.getElementById('game-over').style.display = 'none';

            player = { x: canvas.width / 2 - 15, y: canvas.height / 2, targetX: canvas.width / 2 - 15, w: 30, h: 30, vy: 0, jumpPower: baseJump, level: 0, squash: 1.0, angle: 0, flipAngle: 0, flipDir: 1 };
            platforms = [];
            platforms.push({ x: canvas.width/2 - PLATFORM_W/2, y: canvas.height - 100, w: PLATFORM_W, h: PLATFORM_H, visited: true, dx: 0 });
            
            let rng = LCG(seed);
            let currentY = canvas.height - 100;
            let simJump = baseJump;
            let simScore = 0;

            for(let i = 0; i < 2000; i++) {
                let maxSafeGap = ((simJump * simJump) / (2 * gravity)) * 0.75;
                let minGap = Math.min(40, maxSafeGap * 0.5); 
                currentY -= (rng() * (maxSafeGap - minGap) + minGap);
                
                let isMoving = rng() < 0.35 && i > 2;
                let speed = isMoving ? (rng() > 0.5 ? 2.5 : -2.5) : 0;
                platforms.push({ x: rng() * (canvas.width - PLATFORM_W), y: currentY, w: PLATFORM_W, h: PLATFORM_H, visited: false, dx: speed });

                simScore++;
                if(Math.floor(simScore / 10) > Math.floor((simScore-1)/10)) {
                    simJump -= 0.35;
                    if(simJump < MIN_JUMP) simJump = MIN_JUMP;
                }
            }

            updateUI();
            cancelAnimationFrame(gameLoopId);
            loop();
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('length').innerText = player.level + 1;
        }

        const gyroBtn = document.getElementById('gyro-btn');
        function handleOrientation(e) {
            let gamma = e.gamma; 
            if (gamma > 45) gamma = 45; if (gamma < -45) gamma = -45;
            gyroGamma = gamma;
        }
        gyroBtn.onclick = () => {
            if (useGyro) {
                useGyro = false; gyroBtn.classList.remove('gyro-active');
                window.removeEventListener('deviceorientation', handleOrientation);
                player.targetX = player.x; 
            } else {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(state => {
                        if (state === 'granted') enableGyro();
                    }).catch(console.error);
                } else enableGyro();
            }
        };
        function enableGyro() {
            useGyro = true; gyroBtn.classList.add('gyro-active');
            window.addEventListener('deviceorientation', handleOrientation);
        }

        function loop() {
            if (isGameOver) return;

            if (useGyro) player.targetX = player.x + ((gyroGamma / 45) * 15);
            player.x += (player.targetX - player.x) * (useGyro ? 0.8 : 0.4);
            if (player.x > canvas.width) player.x = -player.w;
            if (player.x + player.w < 0) player.x = canvas.width;

            player.vy += gravity;
            player.y += player.vy;
            player.squash += (1.0 - player.squash) * 0.15;
            if (player.flipAngle > 0) {
                let spinSpeed = 0.25; 
                player.angle += spinSpeed * player.flipDir;
                player.flipAngle -= spinSpeed;
                if (player.flipAngle <= 0) { player.angle = 0; player.flipAngle = 0; }
            }

            if (conn && conn.open) {
                conn.send({ type: 'update', player: { x: player.x, y: player.y, w: player.w, h: player.h, squash: player.squash, angle: player.angle, vy: player.vy, score: score } });
            }

            for (let p of platforms) {
                if (p.dx !== 0) {
                    p.x += p.dx;
                    if (p.x < 0) { p.x = 0; p.dx *= -1; }
                    if (p.x + p.w > canvas.width) { p.x = canvas.width - p.w; p.dx *= -1; }
                }

                if (player.vy > 0) {
                    if (player.y + player.h >= p.y && player.y + player.h - player.vy <= p.y + p.h) {
                        if (player.x + player.w > p.x - 5 && player.x < p.x + p.w + 5) {
                            player.vy = -player.jumpPower; 
                            player.squash = 0.4; player.flipAngle = Math.PI * 2; player.angle = 0;
                            player.flipDir = (useGyro) ? ((gyroGamma > 0) ? 1 : -1) : ((player.targetX > player.x) ? 1 : -1);
                            
                            if (!p.visited) {
                                p.visited = true; score++;
                                let nextLvl = Math.floor(score / 10);
                                if (nextLvl > player.level) {
                                    player.level = nextLvl; player.h += 15; player.jumpPower -= 0.35;
                                    if(player.jumpPower < MIN_JUMP) player.jumpPower = MIN_JUMP;
                                }
                                updateUI();
                            }
                        }
                    }
                }
            }

            const cameraThreshold = canvas.height / 2;
            let camDiff = 0;
            if (player.y < cameraThreshold) {
                camDiff = cameraThreshold - player.y;
                player.y = cameraThreshold;
                platforms.forEach(p => p.y += camDiff);
                if(opponentData) opponentData.y += camDiff;
            }

            if (player.y > canvas.height) { gameOver(); return; }

            draw();
            gameLoopId = requestAnimationFrame(loop);
        }

        function drawEntity(entity, colorMain, isGhost = false) {
            ctx.save(); 
            let cx = entity.x + entity.w / 2;
            let cy = entity.y + entity.h / 2;
            ctx.translate(cx, cy);
            ctx.rotate(entity.angle);
            ctx.scale(2 - entity.squash, entity.squash);

            if (isGhost) ctx.globalAlpha = 0.4; 

            ctx.fillStyle = colorMain;
            ctx.shadowBlur = isGhost ? 10 : 20;
            ctx.shadowColor = colorMain;
            ctx.fillRect(-entity.w / 2, -entity.h / 2, entity.w, entity.h);
            
            ctx.fillStyle = '#0b0c10';
            ctx.shadowBlur = 0;
            ctx.fillRect(-entity.w / 2 + 6, -entity.h / 2 + 6, entity.w - 12, 6);

            let handOffset = -entity.vy * 1.5; 
            if (handOffset < -18) handOffset = -18; if (handOffset > 10) handOffset = 10;
            ctx.fillStyle = isGhost ? colorMain : '#45a29e';
            ctx.fillRect(-entity.w / 2 - 12, handOffset - 6, 8, 12);
            ctx.fillRect(entity.w / 2 + 4, handOffset - 6, 8, 12);
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let p of platforms) {
                if(p.y > canvas.height + 50 || p.y < -50) continue; 
                
                if (!p.visited) {
                    if (p.dx !== 0) { ctx.fillStyle = '#f72585'; ctx.shadowBlur = 15; ctx.shadowColor = '#f72585'; } 
                    else { ctx.fillStyle = '#45a29e'; ctx.shadowBlur = 15; ctx.shadowColor = '#66fcf1'; }
                } else { ctx.fillStyle = '#1f2833'; ctx.shadowBlur = 0; }
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            if (opponentData && !opponentData.isDead) drawEntity(opponentData, '#ff9f1c', true);
            drawEntity(player, '#66fcf1', false);
        }

        function gameOver() {
            isGameOver = true;
            if (conn && conn.open) conn.send({ type: 'dead' });
            
            document.getElementById('final-score').innerText = score;
            
            let title = "TRẠM KHÔNG GIAN SỤP ĐỔ";
            if (opponentData) {
                if(opponentData.isDead) title = "BẠN ĐÃ THẮNG! 🏆";
                else title = "BẠN ĐÃ THUA... 💀";
            }
            document.getElementById('go-title').innerText = title;
            document.getElementById('game-over').style.display = 'flex';
        }

        function handleMovement(xClient) { if(!isGameOver && !useGyro) player.targetX = xClient - player.w / 2; }
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMovement(e.touches[0].clientX); }, {passive: false});
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleMovement(e.touches[0].clientX); }, {passive: false});
        canvas.addEventListener('mousemove', (e) => handleMovement(e.clientX));

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        document.getElementById('restart-btn').addEventListener('click', () => { window.location.reload(); });
    </script>
</body>
</html>
