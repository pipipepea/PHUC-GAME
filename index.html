<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Jumper - By P&T</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0b0c10; color: #66fcf1; font-family: 'Courier New', Courier, monospace; touch-action: none; cursor: crosshair; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1;}
        
        #ui-layer { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; display: none;}
        .stat { margin-bottom: 5px; font-size: 16px; font-weight: bold; text-shadow: 0 0 5px #66fcf1;}
        #score-display { font-size: 24px; color: #45a29e; }
        .opponent-stat { color: #ff9f1c; text-shadow: 0 0 5px #ff9f1c; }
        .mic-stat { color: #ff0055; text-shadow: 0 0 5px #ff0055; font-size: 20px; margin-top: 10px;}

        #mp-lobby { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 40; pointer-events: none;}
        
        #lobby-content { pointer-events: auto; display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 130px;}
        
        @keyframes neonFlicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: 0 0 10px #66fcf1, 0 0 20px #66fcf1, 0 0 40px #66fcf1; color: #e0ffff; }
            20%, 24%, 55% { text-shadow: none; color: #1f2833; }
        }
        #mp-lobby h1 { font-size: 34px; margin: 0; letter-spacing: 2px; position: absolute; top: 6%; animation: neonFlicker 2.5s infinite alternate; text-align: center; width: 100%;}
        
        .box { background: rgba(31, 40, 51, 0.85); padding: 10px 15px; border-radius: 12px; border: 1px solid #45a29e; width: 75%; max-width: 260px; text-align: center; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px);}
        .box h3 { margin: 0 0 6px 0; font-size: 14px; color: #45a29e; letter-spacing: 1px;}
        
        .room-code-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; }
        .room-label { font-size: 11px; color: #c5c6c7; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 1px;}
        .code-box { display: flex; align-items: center; justify-content: space-between; background: #0b0c10; border: 1px solid #ff9f1c; border-radius: 8px; padding: 5px 12px; width: 85%; box-shadow: 0 0 10px rgba(255, 159, 28, 0.2); }
        #my-id-display { font-size: 18px; font-weight: bold; color: #ff9f1c; letter-spacing: 2px; margin:0;}
        
        .action-btns { display: flex; gap: 8px; }
        .icon-btn-small { background: transparent; border: none; font-size: 16px; cursor: pointer; padding: 0; margin: 0; box-shadow: none; width: auto; transition: transform 0.2s; }
        .icon-btn-small:hover { transform: scale(1.2); background: transparent;}

        input[type="text"] { width: 85%; padding: 7px; font-size: 15px; text-align: center; background: #0b0c10; color: #66fcf1; border: 1px solid #45a29e; border-radius: 8px; font-family: inherit; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;}
        input[type="text"]:focus { outline: none; border-color: #66fcf1; box-shadow: 0 0 10px #66fcf1;}
        
        button { padding: 9px 15px; font-size: 14px; font-weight: bold; background: #1f2833; color: #66fcf1; border: 2px solid #66fcf1; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px rgba(102,252,241,0.3); transition: 0.2s; width: 85%; max-width: 280px; margin-bottom: 6px; text-transform: uppercase;}
        button:hover { background: rgba(102, 252, 241, 0.2); box-shadow: 0 0 15px #66fcf1;}
        button:active { background: #66fcf1; color: #0b0c10; }

        @media (min-width: 768px) {
            #mp-lobby h1 { font-size: 46px; top: 5%; }
            #lobby-content { margin-top: 150px; }
            .box { width: 50%; max-width: 440px; padding: 15px 25px; margin-bottom: 15px; }
            .box h3 { font-size: 18px; margin-bottom: 10px; }
            .room-label { font-size: 13px; }
            .code-box { padding: 8px 18px; width: 88%; }
            #my-id-display { font-size: 24px; letter-spacing: 4px; }
            input[type="text"] { width: 88%; padding: 11px; font-size: 18px; margin-bottom: 10px; }
            button { padding: 13px 24px; font-size: 16px; width: 88%; max-width: 400px; margin-bottom: 10px; }
        }
        
        .btn-orange { border-color: #ff9f1c; color: #ff9f1c; box-shadow: 0 0 10px rgba(255,159,28,0.3); }
        .btn-orange:hover { background: rgba(255, 159, 28, 0.2); box-shadow: 0 0 15px #ff9f1c;}
        .btn-orange:active { background: #ff9f1c; color: #0b0c10; }
        
        .btn-green { border-color: #2ecc71; color: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,0.3); margin-top: 4px;}
        .btn-green:hover { background: rgba(46, 204, 113, 0.2); box-shadow: 0 0 15px #2ecc71;}
        .btn-green:active { background: #2ecc71; color: #0b0c10; }

        .btn-gray { border-color: #c5c6c7; color: #c5c6c7; box-shadow: none; margin-top: 4px;}
        .btn-gray:hover { background: rgba(197, 198, 199, 0.2); box-shadow: 0 0 10px #c5c6c7;}
        .btn-gray:active { background: #c5c6c7; color: #0b0c10; }

        #top-right-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; z-index: 15; display:none;}
        .icon-btn { font-size: 28px; cursor: pointer; transition: transform 0.2s, filter 0.2s; text-shadow: 0 0 10px #66fcf1; user-select: none; background: rgba(11, 12, 16, 0.6); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border: 1px solid #45a29e; }
        .gyro-active { filter: hue-rotate(90deg) brightness(1.5); border-color: #2ecc71; }
        
        #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; text-align: center; }
        #game-over h1 { font-size: 40px; text-shadow: 0 0 15px #c5c6c7; color: #c5c6c7; margin-bottom: 10px;}
        
        #toast-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 30; text-align: center; width: 100%;}

        #leaderboard-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(11, 12, 16, 0.98); border: 2px solid #2ecc71; border-radius: 12px; padding: 25px 20px; width: 85%; max-width: 380px; z-index: 50; display: none; box-shadow: 0 0 30px rgba(46, 204, 113, 0.6); text-align: center; max-height: 80vh; overflow-y: auto; pointer-events: auto;}
        #leaderboard-modal h2 { color: #2ecc71; text-shadow: 0 0 10px #2ecc71; margin-top: 0; font-size: 28px; letter-spacing: 2px;}
        .lb-entry { display: flex; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid #1f2833; font-size: 18px;}
        .lb-rank { color: #ff9f1c; font-weight: bold; width: 35px; text-align: left;}
        .lb-name { color: #66fcf1; flex-grow: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .lb-score { color: #2ecc71; font-weight: bold; }
        .lb-loading { color: #c5c6c7; font-style: italic; margin: 20px 0; }

        @keyframes creditPulse {
            0% { opacity: 0.2; text-shadow: 0 0 2px #45a29e; }
            50% { opacity: 1; text-shadow: 0 0 15px #66fcf1, 0 0 25px #66fcf1; }
            100% { opacity: 0.2; text-shadow: 0 0 2px #45a29e; }
        }
        .footer-credit { 
            position: absolute; bottom: 35px; width: 100%; text-align: center; 
            font-size: 15px; color: #66fcf1; letter-spacing: 3px; font-weight: bold; 
            animation: creditPulse 2.5s infinite ease-in-out; pointer-events: none; 
        }
    </style>
</head>
<body>
    <div id="mp-lobby">
        <h1>NEON JUMPER</h1>
        
        <div id="lobby-content">
            <div class="box" id="profile-box">
                <h3>Hồ Sơ Của Bạn</h3>
                <input type="text" id="player-name-input" placeholder="NHẬP TÊN CỦA BẠN" maxlength="12">
                <p style="margin: 0; color: #f72585; font-size: 15px; font-weight: bold; text-shadow: 0 0 10px rgba(247,37,133,0.5);">🏆 Kỷ Lục: <span id="lobby-highscore">0</span></p>
            </div>

            <div class="box">
                <h3>Vào Phòng Bạn Bè</h3>
                
                <div class="room-code-container">
                    <span class="room-label">Mã Của Cậu Chủ:</span>
                    <div class="code-box">
                        <span id="my-id-display">ĐANG TẠO...</span>
                        <div class="action-btns">
                            <button id="refresh-btn" class="icon-btn-small" title="Lấy Mã Mới">🔄</button>
                            <button id="copy-btn" class="icon-btn-small" title="Sao chép">📋</button>
                        </div>
                    </div>
                </div>
                
                <div style="width: 100%; height: 1px; background: rgba(102, 252, 241, 0.2); margin: 8px 0;"></div>
                
                <input type="text" id="peer-id-input" placeholder="NHẬP MÃ BẠN BÈ" maxlength="6">
                <button id="connect-btn" class="btn-orange">Vào Phòng & Chơi</button>
            </div>
            
            <button id="solo-btn" class="btn-gray">Chơi 1 Mình</button>
            <button id="show-lb-btn" class="btn-green">📊 TOP 10</button>
        </div>

        <div class="footer-credit">Bởi : P&T</div>
    </div>

    <div id="leaderboard-modal">
        <h2>TOP 10</h2>
        <div id="lb-content">
            <div class="lb-loading">Đang tải dữ liệu...</div>
        </div>
        <button id="close-lb-btn" style="margin-top: 20px;">Đóng Bảng</button>
    </div>

    <div id="ui-layer">
        <div class="stat" id="score-display">Điểm của <span id="my-ingame-name">Bạn</span>: <span id="score">0</span></div>
        <div class="stat opponent-stat" id="opp-score-container" style="display:none;"><span id="opp-name">Đồng đội</span>: <span id="opp-score">0</span></div>
        <div class="stat mic-stat" id="mic-counter">🎤: 0/3</div>
    </div>
    
    <div id="toast-msg">THÔNG BÁO</div>

    <div id="top-right-controls">
        <div class="icon-btn" id="gyro-btn" title="Bật Cảm Biến Nghiêng">📱</div>
    </div>

    <div id="game-over">
        <h1 id="go-title">VUI LÀ CHÍNH</h1>
        <p style="font-size: 20px;">Thành tích lượt này: <span id="final-score">0</span></p>
        <p style="font-size: 18px; color: #f72585; font-weight:bold; margin-bottom: 15px; text-shadow: 0 0 10px rgba(247,37,133,0.5);">🏆 Kỷ Lục Cá Nhân: <span id="go-highscore">0</span></p>
        <p id="pc-encouragement" style="font-size: 15px; color: #66fcf1; text-shadow: 0 0 8px #66fcf1; margin-bottom: 20px; display: none;">Bạn đã làm rất tốt, chơi trên điện thoại dễ hơn nhiều!</p>
        <button id="restart-btn" class="btn-orange" style="width: auto;">Chơi Lại Cùng Nhau</button>
        <button id="home-btn" class="btn-gray" style="width: auto;">Về Sảnh Chờ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- LỚP BẢO MẬT: KHÓA TÊN MIỀN & GIẢI MÃ API ẨN ---
        // (Cậu chủ có thể thay đổi domain được phép ở biến dưới nếu đưa lên web riêng)
        const allowedDomain = ""; 
        if (window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1" && allowedDomain !== "" && !window.location.hostname.endsWith(allowedDomain)) {
            document.body.innerHTML = "<h1 style='color:#66fcf1; text-align:center; margin-top:40vh; font-family:monospace;'>BẢN QUYỀN THUỘC VỀ P&T - KHÔNG SAO CHÉP</h1>";
            throw new Error("Unauthorized execution.");
        }

        // Giải mã URL Google Sheets từ Base64 để chống soi code trực tiếp
        const GOOGLE_SHEET_URL = atob("aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4WnJZTjA2OTBQcU9yUWRkZU9Fc2pvUjl4dlQtUkFtX19wS0pfc3puU2lLV0t5b2V5UjkteXJueDRpdkF4Z1M2QkRTdy9leGVj");

        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        const basePlatformW = 95;
        const PLATFORM_W = window.innerWidth >= 768 ? basePlatformW * 1.68 : basePlatformW * 0.6;

        let lobbyAnimId;
        let isLobby = true;
        let lobbyPlayer = {
            x: canvas.width / 2 - 40, y: canvas.height * 0.22, 
            baseY: canvas.height * 0.22,
            w: 30, h: 30, angle: 0,
            vy: -7, jumpPower: 7, gravity: 0.2, 
            dir: 1 
        };

        let lobbyFriend = { w: 30, h: 30, angle: 0 };

        function drawEntityRaw(ctx, x, y, w, h, angle, vy, colorStr, isFriend = false) {
            ctx.save(); 
            ctx.translate(x, y); ctx.rotate(angle); 
            ctx.fillStyle = colorStr; ctx.shadowBlur = 20; ctx.shadowColor = colorStr; ctx.fillRect(-w / 2, -h / 2, w, h);
            ctx.fillStyle = '#0b0c10'; ctx.shadowBlur = 0; ctx.fillRect(-w / 2 + 6, -h / 2 + 6, w - 12, 6);
            
            let hOffset;
            if (isFriend) {
                hOffset = Math.sin(Date.now() / 150) * 8 - 5; 
            } else {
                hOffset = -vy * 1.5; if (hOffset < -18) hOffset = -18; if (hOffset > 10) hOffset = 10;
            }

            ctx.fillStyle = '#45a29e'; ctx.fillRect(-w / 2 - 12, hOffset - 6, 8, 12); ctx.fillRect(w / 2 + 4, hOffset - 6, 8, 12);
            ctx.restore();
        }

        function lobbyLoop() {
            if (!isLobby) return;
            ctx.fillStyle = 'rgba(11, 12, 16, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            lobbyPlayer.vy += lobbyPlayer.gravity;
            lobbyPlayer.y += lobbyPlayer.vy;
            lobbyPlayer.x += 1.2 * lobbyPlayer.dir; 
            lobbyPlayer.angle += 0.05 * lobbyPlayer.dir;

            if (lobbyPlayer.y > lobbyPlayer.baseY + 50) {
                lobbyPlayer.y = lobbyPlayer.baseY + 50;
                lobbyPlayer.vy = -lobbyPlayer.jumpPower;
                lobbyPlayer.angle = 0; 
                if (lobbyPlayer.x > canvas.width / 2 + 20) lobbyPlayer.dir = -1;
                if (lobbyPlayer.x < canvas.width / 2 - 80) lobbyPlayer.dir = 1;
            }

            const profileBox = document.getElementById('profile-box');
            if (profileBox) {
                const rect = profileBox.getBoundingClientRect();
                lobbyFriend.x = rect.right - 28; 
                lobbyFriend.y = rect.top - 20;    
            }
            lobbyFriend.angle = Math.sin(Date.now() / 300) * 0.1;

            drawEntityRaw(ctx, lobbyPlayer.x, lobbyPlayer.y, lobbyPlayer.w, lobbyPlayer.h, lobbyPlayer.angle, lobbyPlayer.vy, '#66fcf1', false);
            drawEntityRaw(ctx, lobbyFriend.x, lobbyFriend.y, lobbyFriend.w, lobbyFriend.h, lobbyFriend.angle, 0, '#ff9f1c', true);
            
            lobbyAnimId = requestAnimationFrame(lobbyLoop);
        }
        lobbyLoop();

        // --- GỬI ĐIỂM CÓ KÈM MÃ TOKEN BẢO MẬT CHỐNG HACK ---
        function submitScore(name, score) {
            if (!GOOGLE_SHEET_URL || score <= 0) return;
            let safeName = encodeURIComponent(name);
            // Tạo mã Token dựa trên điểm số và chuỗi khóa bí mật
            let token = btoa(score + "_PT_SECRET_2026");
            let fetchUrl = `${GOOGLE_SHEET_URL}?action=add&name=${safeName}&score=${score}&token=${token}`;
            
            fetch(fetchUrl, { mode: 'no-cors' }).then(res => console.log("Đã lưu điểm an toàn")).catch(err => console.log(err));
        }

        function fetchLeaderboard() {
            const lbContent = document.getElementById('lb-content');
            if (!GOOGLE_SHEET_URL) { lbContent.innerHTML = `<div class="lb-loading" style="color:#f72585;">Chưa cấu hình Link!</div>`; return; }
            lbContent.innerHTML = `<div class="lb-loading">Đang đọc dữ liệu từ Sheets...</div>`;
            
            fetch(`${GOOGLE_SHEET_URL}?action=get`)
                .then(response => response.json())
                .then(entries => {
                    lbContent.innerHTML = '';
                    if (!entries || entries.length === 0) { lbContent.innerHTML = `<div class="lb-loading">Bảng xếp hạng trống!</div>`; return; }
                    entries.forEach((entry, index) => {
                        let row = document.createElement('div'); row.className = 'lb-entry';
                        row.innerHTML = `<div class="lb-rank">#${index + 1}</div><div class="lb-name">${entry.name}</div><div class="lb-score">${entry.score}</div>`;
                        lbContent.appendChild(row);
                    });
                })
                .catch(err => { lbContent.innerHTML = `<div class="lb-loading" style="color:#f72585;">Lỗi kết nối máy chủ Google!</div>`; });
        }

        document.getElementById('show-lb-btn').onclick = () => { document.getElementById('leaderboard-modal').style.display = 'block'; fetchLeaderboard(); };
        document.getElementById('close-lb-btn').onclick = () => { document.getElementById('leaderboard-modal').style.display = 'none'; };

        document.getElementById('home-btn').onclick = () => { window.location.reload(); };

        let myName = localStorage.getItem('neonJumperName') || '';
        let myHighScore = parseInt(localStorage.getItem('neonJumperHighScore')) || 0;
        document.getElementById('player-name-input').value = myName;
        document.getElementById('lobby-highscore').innerText = myHighScore;

        function saveProfile() {
            let n = document.getElementById('player-name-input').value.trim();
            myName = n ? n : 'Người Chơi'; localStorage.setItem('neonJumperName', myName);
            document.getElementById('my-ingame-name').innerText = myName;
        }

        const generateId = () => Math.random().toString(36).substring(2, 8).toUpperCase();
        let myPeerId = generateId(); 
        let peer = new Peer(myPeerId); 
        let conn = null, opponentData = null; 
        let oppRender = { x: -100, y: -100, squash: 1, angle: 0, isDead: false, vy: 0, h: 30, colorStage: 0 }; 

        function initPeerEvents(p) {
            p.on('open', (id) => { document.getElementById('my-id-display').innerText = id; });
            p.on('error', (err) => { if(err.type === 'unavailable-id') { alert("Lỗi mạng, hãy thử lấy mã mới!"); } });
            p.on('connection', (connection) => { conn = connection; setupConnection(); });
        }
        initPeerEvents(peer);

        document.getElementById('copy-btn').onclick = () => { navigator.clipboard.writeText(myPeerId); showToast("✅ Đã sao chép mã phòng!", "#2ecc71"); };
        
        document.getElementById('refresh-btn').onclick = () => {
            document.getElementById('my-id-display').innerText = "ĐANG TẠO...";
            peer.destroy();
            setTimeout(() => {
                myPeerId = generateId();
                peer = new Peer(myPeerId);
                initPeerEvents(peer);
                showToast("🔄 Đã lấy mã mới!", "#66fcf1");
            }, 500);
        };

        let audioContext, analyser, microphone, dataArray, micPermissionGranted = false;
        async function requestMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser(); microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser); analyser.fftSize = 256; dataArray = new Uint8Array(analyser.frequencyBinCount);
                micPermissionGranted = true;
            } catch (err) { micPermissionGranted = false; }
        }

        document.getElementById('connect-btn').onclick = async () => {
            saveProfile(); let targetId = document.getElementById('peer-id-input').value.toUpperCase().trim();
            if(targetId) { await requestMic(); document.getElementById('connect-btn').innerText = "Đang kết nối..."; conn = peer.connect(targetId); setupConnection(); conn.on('open', () => { document.getElementById('connect-btn').innerText = "Đã tìm thấy!"; conn.send({ type: 'ready' }); }); }
        };

        document.getElementById('solo-btn').onclick = async () => { saveProfile(); await requestMic(); startGame(Math.random()); };

        function showToast(text, color) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = text; toast.style.color = color; toast.style.textShadow = `0 0 20px ${color}`;
            toast.style.opacity = '1'; toast.style.transform = 'translate(-50%, -80%) scale(1.2)';
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translate(-50%, -50%) scale(1); }, 2000);
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'ready') { let seed = Math.floor(Math.random() * 99999); conn.send({ type: 'start', seed: seed }); startGame(seed); } 
                else if (data.type === 'start') { startGame(data.seed); }
                else if (data.type === 'update') { opponentData = data.player; document.getElementById('opp-name').innerText = opponentData.name || 'Đồng đội'; document.getElementById('opp-score').innerText = opponentData.score; }
                else if (data.type === 'revive') { player.isDead = false; player.vy = -baseJump * 1.5; player.x = oppRender.x; player.y = oppRender.y - 150; showToast("💖 Cứu một mạng bằng xây 7 tháp! 💖", "#f72585"); }
                else if (data.type === 'slow') { slowTime = 300; }
            });
            conn.on('close', () => { alert("Đồng đội đã ngắt kết nối!"); window.location.reload(); });
        }

        function LCG(seed) { return function() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; } }
        
        document.getElementById('restart-btn').addEventListener('click', () => {
            let seed = Math.floor(Math.random() * 99999);
            if (conn && conn.open) conn.send({ type: 'start', seed: seed }); startGame(seed);
        });

        const gravity = 0.3; const baseJump = 11; const PLATFORM_H = 12; const MIN_JUMP = 7.5;        
        let player, platforms, score, isGameOver, gameLoopId, useGyro = false, gyroGamma = 0, cameraOffset = 0; 
        let slowTime = 0, particles = [], micTimeRemaining = 0; 

        function spawnExplosion(x, y, color) { for(let i = 0; i < 25; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 1.0, color: color }); }
        function spawnExhaust(x, y) { particles.push({ x: x + (Math.random() * 20 - 10), y: y, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 5 + 2, life: 0.8, color: '#ffffff' }); }
        
        function startGame(seed) {
            isLobby = false; cancelAnimationFrame(lobbyAnimId);
            document.getElementById('mp-lobby').style.display = 'none'; document.getElementById('game-over').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block'; document.getElementById('top-right-controls').style.display = 'flex';
            if(conn && conn.open) document.getElementById('opp-score-container').style.display = 'block';
            initGame(seed);
        }

        function initGame(seed) {
            score = 0; isGameOver = false; cameraOffset = 0; particles = []; slowTime = 0; micTimeRemaining = 0;
            opponentData = null; oppRender = { x: -100, y: -100, squash: 1, angle: 0, isDead: false, vy: 0, h: 30, colorStage: 0 }; 

            player = { x: canvas.width / 2 - 15, y: canvas.height / 2, targetX: canvas.width / 2 - 15, w: 30, h: 30, vy: 0, jumpPower: baseJump, colorStage: 0, squash: 1.0, angle: 0, flipAngle: 0, flipDir: 1, isDead: false, webTarget: null, micCount: 0 };
            document.getElementById('mic-counter').innerText = `🎤: 0/3`;

            platforms = [];
            platforms.push({ x: canvas.width/2 - PLATFORM_W/2, y: canvas.height - 100, w: PLATFORM_W, h: PLATFORM_H, visited: true, dx: 0, hp: 6, hasRevive: false, hasShrink: false, hasSnow: false, hasWeb: false, hasMic: false, broken: false });
            
            let rng = LCG(seed); let currentY = canvas.height - 100; let simJump = baseJump; let simScore = 0;

            for(let i = 0; i < 2000; i++) {
                let maxSafeGap = ((simJump * simJump) / (2 * gravity)) * 0.9; let minGap = Math.min(60, maxSafeGap * 0.6); 
                currentY -= (rng() * (maxSafeGap - minGap) + minGap);
                
                let isMoving = rng() < 0.35 && i > 2; let speed = isMoving ? (rng() > 0.5 ? 2.5 : -2.5) : 0; let hp = isMoving ? 3 : 6; 
                let hasHeart = (rng() < 0.08) && i > 10; let hasShrink = (rng() < 0.08) && !hasHeart && i > 5; 
                let hasSnow = (rng() < 0.05) && !hasHeart && !hasShrink && i > 15; let hasWeb = (rng() < 0.05) && !hasHeart && !hasShrink && !hasSnow && i > 20;
                let hasMic = (rng() < 0.15) && !hasHeart && !hasShrink && !hasSnow && !hasWeb; 

                let p1X = rng() * (canvas.width - PLATFORM_W);
                platforms.push({ x: p1X, y: currentY, w: PLATFORM_W, h: PLATFORM_H, hp: hp, broken: false, visited: false, dx: speed, hasRevive: hasHeart, hasShrink: hasShrink, hasSnow: hasSnow, hasWeb: hasWeb, hasMic: hasMic });
                if (rng() < 0.7) {
                    let p2X = (p1X + canvas.width / 2) % (canvas.width - PLATFORM_W); let p2Y = currentY + (rng() * 40 - 20); 
                    platforms.push({ x: p2X, y: p2Y, w: PLATFORM_W, h: PLATFORM_H, hp: 6, broken: false, visited: false, dx: 0, hasRevive: false, hasShrink: false, hasSnow: false, hasWeb: false, hasMic: false });
                }
                simScore++; if(Math.floor(simScore / 20) > Math.floor((simScore-1)/20)) { simJump -= 0.35; if(simJump < MIN_JUMP) simJump = MIN_JUMP; }
            }
            document.getElementById('score').innerText = score; cancelAnimationFrame(gameLoopId); loop();
        }

        const gyroBtn = document.getElementById('gyro-btn');
        function handleOrientation(e) { let gamma = e.gamma; if (gamma > 45) gamma = 45; if (gamma < -45) gamma = -45; gyroGamma = gamma; }
        gyroBtn.onclick = () => {
            if (useGyro) { useGyro = false; gyroBtn.classList.remove('gyro-active'); window.removeEventListener('deviceorientation', handleOrientation); player.targetX = player.x; } 
            else { if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { DeviceOrientationEvent.requestPermission().then(state => { if (state === 'granted') enableGyro(); }).catch(console.error); } else enableGyro(); }
        };
        function enableGyro() { useGyro = true; gyroBtn.classList.add('gyro-active'); window.addEventListener('deviceorientation', handleOrientation); }

        function checkEvol() {
            let expectedLevel = Math.floor(score / 20);
            let maxH = 90; let theoreticalH = 30 + expectedLevel * 15; let oldStage = player.colorStage; 

            if (theoreticalH <= maxH) { player.h = theoreticalH; player.colorStage = 0; } 
            else { player.h = maxH; let excessEvolutions = Math.floor((theoreticalH - maxH) / 15); player.colorStage = excessEvolutions; }

            if (player.colorStage > oldStage && player.colorStage > 0) {
                let newColor = getPlayerColor(player.colorStage); showToast("✨ TA BIẾN HÌNH ĐÂY! ✨", newColor); spawnExplosion(player.x + 15, player.y + player.h / 2, newColor); 
            }
            player.jumpPower = baseJump - (expectedLevel * 0.35); if(player.jumpPower < MIN_JUMP) player.jumpPower = MIN_JUMP;
            document.getElementById('score').innerText = score;
        }

        function getPlayerColor(stage) { if (stage <= 0) return '#66fcf1'; if (stage === 1) return '#00ff00'; if (stage === 2) return '#fee440'; return `hsl(${Date.now() % 360}, 100%, 50%)`; }

        function loop() {
            if (isGameOver) return;
            if (slowTime > 0) slowTime--; if (micTimeRemaining > 0) micTimeRemaining--;

            if (micTimeRemaining > 0 && micPermissionGranted && !player.isDead) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0; for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let average = sum / dataArray.length;
                if (average > 60) { player.vy -= 1.2; if (player.vy < -player.jumpPower * 1.5) player.vy = -player.jumpPower * 1.5; spawnExhaust(player.x + 15, player.y + player.h); }
            }

            if (opponentData) {
                opponentData.screenY = opponentData.worldY + cameraOffset; oppRender.x += (opponentData.x - oppRender.x) * 0.5;
                if (opponentData.vy < -5 || Math.abs(opponentData.screenY - oppRender.y) > 30) { oppRender.y = opponentData.screenY; } else { oppRender.y += (opponentData.screenY - oppRender.y) * 0.6; }
                oppRender.squash += (opponentData.squash - oppRender.squash) * 0.5; oppRender.angle += (opponentData.angle - oppRender.angle) * 0.5;
                oppRender.vy = opponentData.vy; oppRender.isDead = opponentData.isDead; oppRender.h = opponentData.h; 
                if (opponentData.colorStage > oppRender.colorStage) { spawnExplosion(oppRender.x + 15, oppRender.y + oppRender.h / 2, getPlayerColor(opponentData.colorStage)); }
                oppRender.colorStage = opponentData.colorStage;
            }

            if (!player.isDead) {
                if (player.webTarget) {
                    let tx = player.webTarget.x + player.webTarget.w/2 - 15; let ty = player.webTarget.y - player.h;
                    player.x += (tx - player.x) * 0.2; player.y += (ty - player.y) * 0.2; player.vy = 0; 
                    if (Math.abs(player.y - ty) < 15) { player.webTarget.visited = true; player.webTarget = null; player.vy = -player.jumpPower * 1.5; }
                } else {
                    if (useGyro) player.targetX = player.x + ((gyroGamma / 45) * 15);
                    player.x += (player.targetX - player.x) * (useGyro ? 0.8 : 0.4);
                    if (player.x > canvas.width) player.x = -player.w; if (player.x + player.w < 0) player.x = canvas.width;
                    player.vy += gravity; player.y += player.vy; player.squash += (1.0 - player.squash) * 0.15;
                    if (player.flipAngle > 0) { let spinSpeed = 0.25; player.angle += spinSpeed * player.flipDir; player.flipAngle -= spinSpeed; if (player.flipAngle <= 0) { player.angle = 0; player.flipAngle = 0; } }

                    if (player.y > canvas.height) {
                        player.isDead = true; player.h = 30; player.colorStage = 0; player.jumpPower = baseJump; player.micCount = 0; document.getElementById('mic-counter').innerText = `🎤: 0/3`; spawnExplosion(player.x + 15, canvas.height - 20, '#f72585'); 
                    }
                }
            } else {
                if (opponentData && !opponentData.isDead) { let orbitX = oppRender.x + Math.sin(Date.now() / 300) * 50; let orbitY = oppRender.y - 70 + Math.cos(Date.now() / 300) * 20; player.x += (orbitX - player.x) * 0.1; player.y += (orbitY - player.y) * 0.1; }
            }

            for (let i = particles.length - 1; i >= 0; i--) { let pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.04; if (pt.life <= 0) particles.splice(i, 1); }

            if (conn && conn.open) { conn.send({ type: 'update', player: { name: myName, x: player.x, worldY: player.y - cameraOffset, vy: player.vy, squash: player.squash, angle: player.angle, isDead: player.isDead, score: score, h: player.h, colorStage: player.colorStage } }); }

            if (player.isDead && (!conn || !conn.open || (opponentData && opponentData.isDead))) { gameOver(); return; }

            for (let i = 0; i < platforms.length; i++) {
                let p = platforms[i]; if (p.broken) continue; 
                if (p.dx !== 0) { let currentDx = (slowTime > 0) ? p.dx * 0.2 : p.dx; p.x += currentDx; if (p.x < 0) { p.x = 0; p.dx *= -1; } if (p.x + p.w > canvas.width) { p.x = canvas.width - p.w; p.dx *= -1; } }

                if (!player.isDead && player.vy > 0 && !player.webTarget) {
                    if (player.y + player.h >= p.y && player.y + player.h - player.vy <= p.y + p.h) {
                        if (player.x + player.w > p.x - 5 && player.x < p.x + p.w + 5) {
                            
                            p.hp--; if (p.hp <= 0) { p.broken = true; spawnExplosion(p.x + p.w/2, p.y, p.dx !== 0 ? '#f72585' : '#45a29e'); }

                            if (p.hasMic) { p.hasMic = false; player.micCount++; document.getElementById('mic-counter').innerText = `🎤: ${player.micCount}/3`; if (player.micCount >= 3) { player.micCount = 0; document.getElementById('mic-counter').innerText = `🎤: 0/3`; micTimeRemaining = 120; showToast("🎤 THỔI MẠNH ĐỂ BAY! 🎤", "#ff0055"); } }
                            if (p.hasRevive) { p.hasRevive = false; if (conn && conn.open && opponentData && opponentData.isDead) { conn.send({ type: 'revive' }); showToast("💖 Cứu một mạng bằng xây 7 tháp! 💖", "#f72585"); } }
                            if (p.hasShrink) { p.hasShrink = false; spawnExplosion(p.x + p.w / 2, p.y - 15, '#00f0ff'); score = Math.max(0, score - 20); checkEvol(); }
                            if (p.hasSnow) { p.hasSnow = false; slowTime = 300; showToast("❄️ ĐÓNG BĂNG THỜI GIAN! ❄️", "#80d0ff"); if(conn && conn.open) conn.send({type: 'slow'}); }
                            if (p.hasWeb) { p.hasWeb = false; let targetIdx = Math.min(i + 8, platforms.length - 1); player.webTarget = platforms[targetIdx]; showToast("🕸️ NGƯỜI NHỆN! 🕸️", "#fff"); for(let j = i; j <= targetIdx; j++) { if(!platforms[j].visited) { platforms[j].visited = true; score++; } } checkEvol(); }

                            if(!player.webTarget) {
                                player.vy = -player.jumpPower; player.squash = 0.4; player.flipAngle = Math.PI * 2; player.angle = 0; player.flipDir = (useGyro) ? ((gyroGamma > 0) ? 1 : -1) : ((player.targetX > player.x) ? 1 : -1);
                                if (!p.visited) { p.visited = true; score++; checkEvol(); }
                            }
                        }
                    }
                }
            }

            let focusY = player.y; if (player.isDead && opponentData && !opponentData.isDead) { focusY = oppRender.y; }
            const cameraThreshold = canvas.height / 2;
            if (focusY < cameraThreshold) {
                let camDiff = cameraThreshold - focusY; cameraOffset += camDiff; 
                platforms.forEach(p => p.y += camDiff); player.y += camDiff; oppRender.y += camDiff; if(player.webTarget) player.webTarget.y += camDiff; 
            }
            draw(); gameLoopId = requestAnimationFrame(loop);
        }

        function drawEntity(entity, isOpponent = false) {
            if (entity.isDead) {
                ctx.font = "30px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillText("💀", entity.x + 15, entity.y + 15); ctx.shadowBlur = 0; 
                let floatOffset = Math.sin(Date.now() / 150) * 5; ctx.font = "bold 14px Courier New"; ctx.fillStyle = "#ff9f1c"; ctx.fillText("ê cứu tui", entity.x + 15, entity.y - 15 + floatOffset);
                return;
            }
            let colorMain = isOpponent ? getPlayerColor(entity.colorStage) : getPlayerColor(entity.colorStage);
            drawEntityRaw(ctx, entity.x + 15, entity.y + (entity.h || 30) / 2, 30, entity.h || 30, entity.angle, entity.vy, colorMain, false);
        }

        function drawRadar() {
            if (opponentData && !opponentData.isDead) {
                let oppScreenX = oppRender.x + 15; let oppScreenY = oppRender.y + 15;
                if (oppScreenY < 0 || oppScreenY > canvas.height) {
                    let color = getPlayerColor(oppRender.colorStage); ctx.save(); ctx.fillStyle = color; ctx.shadowBlur = 15; ctx.shadowColor = color; ctx.beginPath();
                    let nameDisplay = opponentData.name || "ĐỒNG ĐỘI";
                    if (oppScreenY < 0) { ctx.moveTo(oppScreenX, 20); ctx.lineTo(oppScreenX - 12, 40); ctx.lineTo(oppScreenX + 12, 40); ctx.fill(); ctx.font = "bold 12px Courier New"; ctx.textAlign = "center"; ctx.fillText(nameDisplay, oppScreenX, 55); } 
                    else { ctx.moveTo(oppScreenX, canvas.height - 20); ctx.lineTo(oppScreenX - 12, canvas.height - 40); ctx.lineTo(oppScreenX + 12, canvas.height - 40); ctx.fill(); ctx.font = "bold 12px Courier New"; ctx.textAlign = "center"; ctx.fillText(nameDisplay, oppScreenX, canvas.height - 55); }
                    ctx.restore();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (slowTime > 0) { ctx.fillStyle = "rgba(0, 200, 255, 0.08)"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            if (micTimeRemaining > 0) { ctx.fillStyle = "rgba(255, 0, 85, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height); } 

            for (let p of platforms) {
                if(p.y > canvas.height + 50 || p.y < -50 || p.broken) continue; 
                if (!p.visited) { if (p.dx !== 0) { ctx.fillStyle = '#f72585'; ctx.shadowBlur = 15; ctx.shadowColor = '#f72585'; } else { ctx.fillStyle = '#45a29e'; ctx.shadowBlur = 15; ctx.shadowColor = '#66fcf1'; } } else { ctx.fillStyle = '#1f2833'; ctx.shadowBlur = 0; }
                
                ctx.globalAlpha = p.dx === 0 ? (p.hp / 6) * 0.5 + 0.5 : (p.hp / 3) * 0.5 + 0.5; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.globalAlpha = 1.0;
                let bounce = Math.sin(Date.now() / 200) * 5;
                ctx.font = "bold 10px Courier New"; ctx.fillStyle = "#0b0c10"; ctx.fillText(p.hp, p.x + p.w / 2, p.y + 10);
                
                ctx.font = "24px Arial";
                if (p.hasMic) { ctx.shadowBlur = 15; ctx.shadowColor = '#ff0055'; ctx.fillText("🎤", p.x + p.w / 2, p.y - 15 + bounce); }
                else if (p.hasRevive) { ctx.shadowBlur = 15; ctx.shadowColor = '#f72585'; ctx.fillText("💖", p.x + p.w / 2, p.y - 15 + bounce); }
                else if (p.hasSnow) { ctx.shadowBlur = 15; ctx.shadowColor = '#00f0ff'; ctx.fillText("❄️", p.x + p.w / 2, p.y - 15 + bounce); }
                else if (p.hasWeb) { ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillText("🕸️", p.x + p.w / 2, p.y - 15 + bounce); }
                else if (p.hasShrink) { ctx.save(); ctx.translate(p.x + p.w / 2, p.y - 15); ctx.rotate(Date.now() / 150); ctx.fillStyle = '#00f0ff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00f0ff'; ctx.fillRect(-8, -8, 16, 16); ctx.restore(); }
                ctx.shadowBlur = 0;
            }

            if (player.webTarget) { ctx.beginPath(); ctx.moveTo(player.x + 15, player.y + 15); ctx.lineTo(player.webTarget.x + player.webTarget.w/2, player.webTarget.y + player.webTarget.h/2); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = "#ffffff"; ctx.stroke(); ctx.shadowBlur = 0; }

            if (opponentData) { if (opponentData.isDead) drawEntity(oppRender, true); }
            if (player.isDead) drawEntity(player, false);
            if (opponentData && !opponentData.isDead) drawEntity(oppRender, true);
            if (!player.isDead) drawEntity(player, false);

            particles.forEach(pt => { ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color; ctx.shadowBlur = 15; ctx.shadowColor = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2); ctx.fill(); });
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0; drawRadar(); 
        }

        function gameOver() {
            isGameOver = true; let finalScore = score;
            if (score > myHighScore) { myHighScore = score; localStorage.setItem('neonJumperHighScore', myHighScore); document.getElementById('lobby-highscore').innerText = myHighScore; submitScore(myName, myHighScore); }
            if (opponentData && opponentData.score > score) finalScore = opponentData.score;
            document.getElementById('final-score').innerText = finalScore; document.getElementById('go-highscore').innerText = myHighScore;
            
            if (window.innerWidth >= 768) {
                document.getElementById('pc-encouragement').style.display = 'block';
            } else {
                document.getElementById('pc-encouragement').style.display = 'none';
            }

            document.getElementById('game-over').style.display = 'flex';
        }

        function handleMovement(xClient) { if(!isGameOver && !useGyro && !player.isDead) player.targetX = xClient - player.w / 2; }
        canvas.addEventListener('touchmock', (e) => {}, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMovement(e.touches[0].clientX); }, {passive: false});
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleMovement(e.touches[0].clientX); }, {passive: false});
        canvas.addEventListener('mousemove', (e) => handleMovement(e.clientX));
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
